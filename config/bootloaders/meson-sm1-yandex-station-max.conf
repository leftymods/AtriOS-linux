# Shared hardware boot recipe for station-max and its yndxsttion53 alias.
# Other boards must provide their own reviewed recipe; no Station fallback.
UBOOT_CONFIG_SOURCE="$UBOOT_SOURCE_DIR/uboot_station_max_defconfig"
UBOOT_DTS_SOURCE="$UBOOT_SOURCE_DIR/dts/$DTS_NAME.dts"
UBOOT_DTS_TARGET="dts/upstream/src/arm64/amlogic/meson-sm1-atristation.dts"
UBOOT_DTS_OVERLAY_SOURCE="$UBOOT_SOURCE_DIR/aml_burn/meson-sm1-atristation-u-boot.dtsi"
UBOOT_DTS_OVERLAY_TARGET="arch/arm/dts/meson-sm1-atristation-u-boot.dtsi"
UBOOT_AML_BURN_SOURCE="$UBOOT_SOURCE_DIR/aml_burn"
UBOOT_REQUIRED_OPTIONS="CONFIG_CMD_AML_BURN CONFIG_USB_FUNCTION_AML_BURN CONFIG_USB_DWC3_GADGET"
FIP_PROFILE="sei610"
