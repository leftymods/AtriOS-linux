# Board Configuration Template
BOARD="new-board"
BOARD_NAME="New Custom Device"
VENDOR="generic"
BOARDFAMILY="amlogic-meson64"
SOC="sm1"
SOC_NAME="Amlogic S905X3"
ARCH="arm64"
DTS_NAME="meson-sm1-generic"
UBOOT_DEFCONFIG="generic_defconfig"
UBOOT_SOURCE_DIR="board/generic"
UPGRADE_DIR="device/generic/upgrade"
BOOTLOADER_TYPE="fip"
FIP_SOC="g12a"
SERIAL_CONSOLE="ttyAML0,115200"
DEFAULT_FORMATS="etcher,sdcard"
ROOTFS_OVERLAY="board/generic/rootfs_overlay"
KERNEL_DEFCONFIG="defconfig"
BUILDROOT_DEFCONFIG="buildroot_generic_defconfig"

# Hardware capability manifest metadata (written to /etc/atrios/hardware.json)
HW_DISPLAY_TYPE="none"
HW_DISPLAY_WIDTH=0
HW_DISPLAY_HEIGHT=0
HW_RING_LEDS=0
HW_AMP_I2C_BUS=2
HW_AMP_TWEETER_ADDR="0x2a"
HW_AMP_WOOFER_ADDR="0x2b"
HW_MIC_CHANNELS=4
HW_CAPTURE_DEVICE="hw:0,0"
HW_BT_UART="/dev/ttyAML1"
HW_ZIGBEE_UART=""
HW_HAS_ROTARY=false
HW_HAS_ALS=false
HW_HAS_ZIGBEE=false
HW_HAS_BT=true
