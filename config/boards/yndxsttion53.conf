# Board Configuration: Yandex Station Max (yndxsttion53)
BOARD="yndxsttion53"
BOARD_NAME="Yandex Station Max"
VENDOR="yandex"
BOARDFAMILY="amlogic-meson64"
SOC="sm1"
SOC_NAME="Amlogic S905X3"
ARCH="arm64"
DTS_NAME="meson-sm1-yandex-station-max"
UBOOT_DEFCONFIG="yndxsttion53_defconfig"
UBOOT_SOURCE_DIR="board/yandex/station2/mainline"
UPGRADE_DIR="device/yandex/station_max/upgrade"
BOOTLOADER_TYPE="fip"
FIP_SOC="sei610"
SERIAL_CONSOLE="ttyAML0,115200"
DEFAULT_FORMATS="emmc"
ROOTFS_OVERLAY="board/yandex/station2/rootfs_overlay"
KERNEL_DEFCONFIG="linux_7.0_yndxsttion53_defconfig"
BUILDROOT_DEFCONFIG="buildroot_yndxsttion53_defconfig"

# Kernel archive pin is inherited from the family; KERNEL_SOURCE_DIR may select a local tree.

# Hardware capability manifest metadata (written to /etc/atrios/hardware.json)
HW_DISPLAY_TYPE="matrix-fb"
HW_DISPLAY_WIDTH=25
HW_DISPLAY_HEIGHT=16
HW_RING_LEDS=24
HW_AMP_I2C_BUS=2
HW_AMP_TWEETER_ADDR="0x2a"
HW_AMP_WOOFER_ADDR="0x2b"
HW_MIC_CHANNELS=8
HW_CAPTURE_DEVICE="hw:0,3"
HW_BT_UART="/dev/ttyAML1"
HW_ZIGBEE_UART="/dev/ttyAML2"
HW_HAS_ROTARY=true
HW_HAS_ALS=true
HW_HAS_ZIGBEE=true
HW_HAS_BT=true
