# ==============================================================================
# AtriOS System Profile: full (flagship / high-RAM smart speakers)
# Target hardware: >= 1 GB RAM, >= 4 GB eMMC (e.g. Yandex Station Max / Station 2)
# ==============================================================================
ATRIOS_PROFILE="full"

# Base OS & Package Profile
ROOTFS_DISTRO="debian"
ROOTFS_SUITE="bookworm"
ROOTFS_SHELL="fish"
ROOTFS_PARTITION_SIZE=2097152
ROOTFS_BASE_PACKAGES="ca-certificates,openssl,fish,kmod,util-linux,coreutils,passwd,wireless-regdb,iw,hostname,ncurses-base,ncurses-bin"

# AtriOS System Application Flavor (full | lite | minimal)
ATRIOS_APP_FLAVOR="full"

# Modular System Services & Subsystems
MOD_ATRIAI=true
MOD_YMUSIC=true
MOD_BLUETOOTH=true
MOD_PIPEWIRE=true
MOD_DISPLAY=true
MOD_ROTARY=true
MOD_LIGHT=true
MOD_ZIGBEE=true
MOD_OTA=true

# Default Audio / DSP Pipeline
AUDIO_VQE_MICS=7
AUDIO_AEC_ENGINE="pbfdaf"
AUDIO_NS_ENGINE="gtcrn"
AUDIO_ENABLE_STFT_KALMAN=true
