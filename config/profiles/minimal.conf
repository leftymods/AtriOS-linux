# ==============================================================================
# AtriOS System Profile: minimal (ultra-low-RAM / headless / bringup devices)
# Target hardware: <= 256 MB RAM, <= 256 MB flash
# Uses Alpine Linux + minimal AtriOS runtime + core network/OTA/audio only
# ==============================================================================
ATRIOS_PROFILE="minimal"

# Base OS & Package Profile
ROOTFS_DISTRO="alpine"
ROOTFS_SUITE="3.20"
ROOTFS_SHELL="sh"
ROOTFS_PARTITION_SIZE=262144
ROOTFS_BASE_PACKAGES="alpine-baselayout busybox ca-certificates iw kmod wireless-regdb musl"

# AtriOS System Application Flavor (full | lite | minimal)
ATRIOS_APP_FLAVOR="minimal"

# Modular System Services & Subsystems
MOD_ATRIAI=false
MOD_YMUSIC=false
MOD_BLUETOOTH=false
MOD_PIPEWIRE=false
MOD_DISPLAY=false
MOD_ROTARY=false
MOD_LIGHT=false
MOD_ZIGBEE=false
MOD_OTA=true

# Default Audio / DSP Pipeline (bypass / zero DSP overhead)
AUDIO_VQE_MICS=1
AUDIO_AEC_ENGINE="none"
AUDIO_NS_ENGINE="none"
AUDIO_ENABLE_STFT_KALMAN=false
