# ==============================================================================
# AtriOS System Profile: lite (compact / older / low-RAM smart speakers)
# Target hardware: 256-512 MB RAM, 256 MB - 4 GB flash (e.g. Station Lite / Mini)
# Uses Alpine Linux (musl + BusyBox) + lightweight AtriOS runtime + no ONNX/PipeWire
# ==============================================================================
ATRIOS_PROFILE="lite"

# Base OS & Package Profile
ROOTFS_DISTRO="alpine"
ROOTFS_SUITE="3.20"
ROOTFS_SHELL="sh"
ROOTFS_PARTITION_SIZE=524288
ROOTFS_BASE_PACKAGES="alpine-baselayout busybox ca-certificates iw kmod wireless-regdb musl alsa-utils"

# AtriOS System Application Flavor (full | lite | minimal)
ATRIOS_APP_FLAVOR="lite"

# Modular System Services & Subsystems
MOD_ATRIAI=true
MOD_YMUSIC=true
MOD_BLUETOOTH=true
MOD_PIPEWIRE=false
MOD_DISPLAY=false
MOD_ROTARY=false
MOD_LIGHT=true
MOD_ZIGBEE=false
MOD_OTA=true

# Default Audio / DSP Pipeline (lightweight, zero ONNX Runtime)
AUDIO_VQE_MICS=4
AUDIO_AEC_ENGINE="nlms"
AUDIO_NS_ENGINE="bnr"
AUDIO_ENABLE_STFT_KALMAN=true
