# /etc/asound.conf - AtriOS ALSA configuration for Yandex Station Max (AML-AUGESOUND)

pcm.!default {
    type asym
    playback.pcm "playback_plug"
    capture.pcm "capture_plug"
}

ctl.!default {
    type hw
    card "AMLAUGESOUND"
}

# Capture plug alias used by atrios audio / mic tools (TODDR_A hw:0,3 -> PDM Capture)
pcm.capture_plug {
    type plug
    slave {
        pcm "hw:AMLAUGESOUND,3"
        rate 48000
        format S32_LE
        channels 2
    }
}

# Playback dmix + plug alias: mixes Bluetooth and AI TTS streams concurrently
# at 48000Hz S16_LE stereo required by the Amlogic S905X3 TDM-B bus and SY6045S DAC.
pcm.playback_dmix {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:AMLAUGESOUND,0"
        rate 48000
        format S16_LE
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.playback_plug {
    type plug
    slave.pcm "playback_dmix"
}
