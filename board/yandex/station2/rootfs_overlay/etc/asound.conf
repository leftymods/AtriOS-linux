# /etc/asound.conf - AtriOS ALSA configuration for Yandex Station Max (AML-AUGESOUND)

pcm.!default {
    type asym
    playback.pcm "playback_plug"
    capture.pcm "capture_plug"
}

pcm.playback_plug {
    type plug
    slave.pcm "dmixer"
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:AMLAUGESOUND,0"
        format S32_LE
        rate 48000
        channels 2
        period_time 0
        period_size 1024
        buffer_size 4096
    }
    bindings {
        0 0
        1 1
    }
}

pcm.capture_plug {
    type plug
    slave {
        pcm "hw:AMLAUGESOUND,1"
        format S32_LE
        rate 48000
        channels 8
    }
}

ctl.!default {
    type hw
    card "AMLAUGESOUND"
}
