# /etc/asound.conf - AtriOS ALSA configuration for Yandex Station Max (AML-AUGESOUND)

pcm.!default {
    type asym
    playback.pcm "playback_plug"
    capture.pcm "plughw:AMLAUGESOUND,0"
}

ctl.!default {
    type hw
    card "AMLAUGESOUND"
}

# Capture plug alias used by atrios audio / mic tools
pcm.capture_plug {
    type plug
    slave.pcm "hw:AMLAUGESOUND,0"
}

# Playback plug alias: converts any incoming sample rate/format (e.g. 44.1kHz S16_LE from Bluetooth)
# to 48000Hz S16_LE stereo required by the Amlogic S905X3 TDM-B bus and SY6045S DAC.
pcm.playback_plug {
    type plug
    slave {
        pcm "hw:AMLAUGESOUND,0"
        rate 48000
        format S16_LE
        channels 2
    }
}
