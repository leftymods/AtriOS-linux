# /etc/asound.conf - AtriOS ALSA configuration for the mainline image
#
# Mainline ASoC (DPCM) exposes only the DMA front-ends, in dai-link order:
#   PCM 0 - playback -> TDM-B (FRDDR_A)  : woofer, tweeters, headphone DAC
#   PCM 1 - capture  <- TDM-B (TODDR_A)  : ES7210 mic array (2 slots)
#   PCM 2 - capture  <- PDM   (TODDR_B)  : on-board PDM mics (4 channels)
# There is no PCM 3 on mainline, and PCM 0 is playback-only.  See
# docs/audio.md §6.1.
pcm.!default {
    type asym
    playback.pcm "plughw:AMLAUGESOUND,0"
    capture.pcm "plughw:AMLAUGESOUND,1"
}

# Fallback used by /usr/lib/atrios/audio when no explicit device works.
# The on-board array is wired to TDM-B din0, two slots (2 channels max).
pcm.capture_plug {
    type plug
    slave.pcm "hw:AMLAUGESOUND,1"
}

# PDM mics are not the default: keep them explicit.  They accept 4
# channels even though the controller supports 8.
pcm.pdm {
    type plug
    slave.pcm "hw:AMLAUGESOUND,2"
}

ctl.!default {
    type hw
    card "AMLAUGESOUND"
}
