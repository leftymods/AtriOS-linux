name: Release signed mainline firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v1.2.3)
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-mainline-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        board: [station-max, yndxsttion53]
    env:
      BOARD: ${{ matrix.board }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate existing release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - name: Resolve selected board release paths
        run: |
          set -euo pipefail
          source lib/release-board.sh
          release_board_config "$BOARD"
          printf 'ROOTFS_OVERLAY_PATH=%s\nDTB_IMAGE=%s\nIMAGE_FILENAME=%s\nOTA_RUNTIME_MANIFEST_PATH=%s\n' \
            "$ROOTFS_OVERLAY_PATH" "$DTB_IMAGE" "$IMAGE_FILENAME" "$OTA_RUNTIME_MANIFEST_PATH" >> "$GITHUB_ENV"
      - name: Install mainline build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev libncurses-dev libgnutls28-dev uuid-dev device-tree-compiler \
            python3 python3-pytest python3-yaml python3-aiohttp python3-pyelftools python3-setuptools \
            swig openssl ca-certificates git make patch rsync file xz-utils \
            debootstrap debian-archive-keyring qemu-user-static binfmt-support \
            dosfstools mtools fdisk u-boot-tools kmod dpkg-dev ncurses-bin
          sudo update-binfmts --enable qemu-aarch64
      - name: Provision OTA signing key and image trust anchor
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_KEY" || { echo 'OTA_SIGNING_KEY secret is required'; exit 1; }
          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY" > "$RUNNER_TEMP/ota-signing.pem"
          openssl rsa -in "$RUNNER_TEMP/ota-signing.pem" -check -noout >/dev/null
          mkdir -p "$ROOTFS_OVERLAY_PATH/etc/atrios"
          openssl rsa -in "$RUNNER_TEMP/ota-signing.pem" -pubout \
            -out "$ROOTFS_OVERLAY_PATH/etc/atrios/ota-public.pem"
          chmod 644 "$ROOTFS_OVERLAY_PATH/etc/atrios/ota-public.pem"
          printf '%s\n' "${RELEASE_TAG#v}" > "$ROOTFS_OVERLAY_PATH/etc/atrios-version"
          sed -i "s/^RELEASE_VERSION=.*/RELEASE_VERSION=\"${RELEASE_TAG#v}\"/" config/system.conf
      - name: Run local build and release regressions
        run: bash .github/scripts/run-firmware-tests.sh
      - name: Build complete mainline image and current modules
        run: bash ./compile.sh "BOARD=$BOARD" TARGET=image
      - name: Create signed OTA bundle
        run: |
          set -euo pipefail
          source lib/release-board.sh
          release_board_config "$BOARD"
          source lib/compilation-kernel.sh
          resolve_kernel_build_profile
          KERNEL_RELEASE="$(cat "$KERNEL_BUILD_DIR/include/config/kernel.release")"
          export OTA_OVERLAY="$RUNNER_TEMP/ota-overlay"
          manifest_args=()
          if [ -n "$OTA_RUNTIME_MANIFEST_PATH" ]; then
            manifest_args+=(--runtime-manifest "$OTA_RUNTIME_MANIFEST_PATH")
          fi
          python3 tools/stage_ota_runtime.py \
            --source output/rootfs_debian_staging --destination "$OTA_OVERLAY" \
            --board "$BOARD" --version "${RELEASE_TAG#v}" "${manifest_args[@]}"
          python3 tools/create_ota_bundle.py \
            --board "$BOARD" --version "${RELEASE_TAG#v}" \
            --kernel-release "$KERNEL_RELEASE" \
            --kernel output/images/Image \
            --dtb "$DTB_IMAGE" \
            --rootfs "$OTA_OVERLAY" \
            --modules "output/rootfs_debian_staging/usr/lib/modules/$KERNEL_RELEASE" \
            --signing-key "$RUNNER_TEMP/ota-signing.pem" \
            --output-dir output/releases
      - name: Stage public assets
        run: |
          set -euo pipefail
          mkdir -p output/release-assets
          cp "output/images/$IMAGE_FILENAME" \
            "output/images/$IMAGE_FILENAME.sha256" \
            "output/releases/AtriOS-$BOARD-ota.tar.gz" \
            "output/releases/AtriOS-$BOARD-ota.tar.gz.sha256" output/release-assets/
          (cd output/release-assets && sha256sum "$IMAGE_FILENAME" > "$IMAGE_FILENAME.sha256")
      - name: Upload public release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atrios-release-${{ matrix.board }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: output/release-assets/*
      - name: Remove private signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ota-signing.pem"

  publish:
    name: Publish verified assets to GitHub Releases
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: atrios-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify asset checksums and publish complete release
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          source lib/release-board.sh
          # Explicit release allowlist; new hardware needs a reviewed CI entry.
          for board in station-max yndxsttion53; do (
            release_board_config "$board"
            test -s "release-assets/AtriOS-$board-ota.tar.gz"
            test -s "release-assets/$IMAGE_FILENAME"
            test -s "release-assets/AtriOS-$board-ota.tar.gz.sha256"
            test -s "release-assets/$IMAGE_FILENAME.sha256"
          ); done
          # Compare every uploaded artifact with its detached digest.
          for sidecar in release-assets/*.sha256; do
            asset="${sidecar%.sha256}"
            expected="$(awk 'NR == 1 { print $1 }' "$sidecar")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            actual="$(sha256sum "$asset" | cut -d' ' -f1)"
            test "$actual" = "$expected"
          done
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            test "$draft" = true || { echo 'Refusing to replace an already published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "AtriOS $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          # Keep app-v* APK releases as the companion app's latest release.
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
