name: Build AtriOS firmware

# Reproducible, self-contained firmware build.
# Everything comes from the repository: bootloader assets, DTS, kernel image,
# vendor modules, fw_builder and the build scripts.  The version is taken from
# the tracked VERSION file unless it is overridden when run manually.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version number (empty = use ./VERSION)
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
      - master
      - slim
    paths:
      - "VERSION"
      - "build_atrios.sh"
      - "Makefile"
      - "board/**"
      - "device/**"
      - "tools/bin/**"
      - "tools/fw_builder/**"
      - "prebuilts/misc/linux-x86/dtc/**"
      - ".github/workflows/build-atrios.yml"

permissions:
  contents: read

concurrency:
  group: atrios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify and package image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FW_VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Checkout firmware build inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            board
            device
            tools/bin
            tools/fw_builder
            prebuilts/misc/linux-x86/dtc
          sparse-checkout-cone-mode: true
          filter: blob:none
          fetch-depth: 1

      - name: Verify checkout contents
        run: |
          du -sh .git .
          find . -path ./.git -prune -o -type f -print | wc -l
          for p in \
            build_atrios.sh \
            VERSION \
            board/yandex/station2/station2_defconfig \
            device/yandex/station_max/upgrade/bootloader.img \
            device/yandex/station_max/upgrade/u-boot.bin.sd.bin \
            tools/bin/make_ext4fs \
            tools/bin/ampack \
            tools/fw_builder/fw_builder.py \
            prebuilts/misc/linux-x86/dtc/dtc; do
            test -e "$p" || { echo "Missing required path: $p"; exit 1; }
          done

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash bc bison build-essential bzip2 ca-certificates cpio \
            device-tree-compiler diffutils file flex g++-13 gawk gcc-13 \
            gettext git gperf kmod libelf-dev libncurses-dev libssl-dev \
            make patch perl python3 python3-cryptography python3-pip \
            python3-setuptools rsync sed tar texinfo unzip wget xz-utils \
            zlib1g-dev zstd

      - name: Show toolchain and disk
        run: |
          nproc
          free -h
          df -h /
          gcc-13 --version | head -1
          g++-13 --version | head -1
          cat VERSION

      - name: Build firmware image
        run: |
          set -o pipefail
          if [ -n "$FW_VERSION" ]; then
            ./build_atrios.sh -n "$FW_VERSION" 2>&1 | tee build.log
          else
            ./build_atrios.sh 2>&1 | tee build.log
          fi

      - name: Resolve built image
        run: |
          IMG="$(ls -t tools/fw_builder/yandex_s905x3_custom_v*.img | head -1)"
          test -s "$IMG"
          VER="$(basename "$IMG" | sed 's/.*_v//; s/\.img$//')"
          echo "Resolved image: $IMG (v$VER)"
          echo "FW_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Verify image
        run: |
          IMG="tools/fw_builder/yandex_s905x3_custom_v${FW_VERSION}.img"
          tools/bin/ampack verify "$IMG"
          sha256sum "$IMG" | tee "${IMG}.sha256"
          ls -lh "$IMG"

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: atrios-firmware-v${{ env.FW_VERSION }}
          path: |
            tools/fw_builder/yandex_s905x3_custom_v${{ env.FW_VERSION }}.img
            tools/fw_builder/yandex_s905x3_custom_v${{ env.FW_VERSION }}.img.sha256
          compression-level: 0
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atrios-build-log-v${{ env.FW_VERSION }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
