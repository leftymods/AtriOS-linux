name: Mainline build checks
on:
  workflow_dispatch:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]
permissions:
  contents: read
concurrency:
  group: mainline-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-yaml python3-aiohttp openssl gcc patch rsync ncurses-bin kmod dpkg-dev dosfstools mtools fdisk u-boot-tools
      - name: Check build, drivers, HTTPS, updates and C protocol regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash .github/scripts/run-firmware-tests.sh
